name: TBASwift
options:
  bundleIdPrefix: com.tba
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  TBASwift:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TBASwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tba.TBASwift
        INFOPLIST_FILE: TBASwift/Info.plist
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
